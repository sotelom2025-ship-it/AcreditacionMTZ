<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a6b">
<title>MTZ – Municipio de La Matanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a3a6b;
    --orange: #e87e2a;
    --cyan: #2bbcd4;
    --dark: #1c2a3a;
    --gray: #f0f4f8;
    --gray2: #d0dce8;
    --text: #2c3e50;
    --text-light: #6b7c93;
    --white: #ffffff;
    --success: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --shadow: 0 4px 20px rgba(26,58,107,0.12);
    --shadow-lg: 0 8px 40px rgba(26,58,107,0.18);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--gray);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ===== LOGIN ===== */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(145deg, #0e2244 0%, #1a3a6b 50%, #0d3356 100%);
    padding: 20px;
  }
  .login-card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-logo {
    margin-bottom: 32px;
  }
  .login-logo .logo-mtz {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-letters {
    display: flex;
    align-items: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 1;
    letter-spacing: -2px;
  }
  .logo-m { color: var(--blue); }
  .logo-t { color: var(--orange); }
  .logo-z { color: var(--cyan); }
  .logo-subtitle {
    font-family: 'Nunito', sans-serif;
    color: var(--text-light);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .login-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--blue);
    font-size: 22px;
    margin-bottom: 8px;
  }
  .login-desc {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 32px;
  }
  .role-tabs {
    display: flex;
    background: var(--gray);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .role-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-light);
    transition: all 0.2s;
  }
  .role-tab.active {
    background: white;
    color: var(--blue);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }
  .form-group label {
    display: block;
    font-weight: 700;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--gray2);
    border-radius: var(--radius-sm);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: white;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(43,188,212,0.15);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue) 0%, #2250a0 100%);
    color: white;
    width: 100%;
    box-shadow: 0 4px 15px rgba(26,58,107,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,58,107,0.4); }
  .btn-orange {
    background: linear-gradient(135deg, var(--orange) 0%, #d46a1a 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(232,126,42,0.3);
  }
  .btn-cyan {
    background: linear-gradient(135deg, var(--cyan) 0%, #1a9fb8 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(43,188,212,0.3);
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-light);
    border: 2px solid var(--gray2);
  }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .btn-icon { padding: 8px; border-radius: 8px; }
  .login-error {
    background: #fde8e8;
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    display: none;
  }

  /* ===== MAIN APP ===== */
  #app { display: none; min-height: 100vh; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0e2244 0%, var(--blue) 100%);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo .logo-letters { font-size: 28px; }
  .header-logo .logo-subtitle { color: rgba(255,255,255,0.6); font-size: 11px; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 14px;
    color: white;
    font-weight: 700;
    font-size: 13px;
  }
  .user-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
  }
  .btn-logout {
    background: rgba(255,255,255,0.1);
    border: none;
    color: rgba(255,255,255,0.7);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.2); color: white; }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 24px;
    font-size: 12px;
    font-weight: 700;
    justify-content: flex-end;
  }
  .status-bar.online { background: #e8f8f0; color: var(--success); }
  .status-bar.offline { background: #fef9e7; color: var(--warning); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-bar.online .status-dot { background: var(--success); }
  .status-bar.offline .status-dot { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* LAYOUT */
  .app-layout {
    display: flex;
    min-height: calc(100vh - 64px);
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: white;
    border-right: 1px solid var(--gray2);
    padding: 24px 0;
    flex-shrink: 0;
    box-shadow: 2px 0 10px rgba(0,0,0,0.04);
  }
  .sidebar-section {
    padding: 0 16px;
    margin-bottom: 8px;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-light);
    padding: 8px 8px 4px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-light);
    transition: all 0.18s;
    margin-bottom: 2px;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--gray); color: var(--blue); }
  .nav-item.active { background: linear-gradient(135deg, #e8f0ff, #ddf5fa); color: var(--blue); }
  .nav-item.active .nav-icon { color: var(--cyan); }
  .nav-icon { font-size: 18px; width: 22px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    background: var(--orange);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    padding: 28px;
    overflow-x: hidden;
  }

  /* PAGE HEADER */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--blue);
  }
  .page-title span {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* CARDS */
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--gray);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--blue);
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-body { padding: 22px; }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .stat-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .stat-icon.blue { background: linear-gradient(135deg, #e8f0ff, #ddeeff); }
  .stat-icon.orange { background: linear-gradient(135deg, #fff3e0, #ffe0b5); }
  .stat-icon.cyan { background: linear-gradient(135deg, #e0f8fc, #b5f0f7); }
  .stat-icon.green { background: linear-gradient(135deg, #e8f8f0, #b5efd0); }
  .stat-value {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--blue);
    line-height: 1;
  }
  .stat-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* FORM SECTION */
  .form-section {
    margin-bottom: 28px;
  }
  .form-section-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--blue);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--gray);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-section-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 16px;
    background: linear-gradient(var(--orange), var(--cyan));
    border-radius: 2px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  /* TABLE */
  .table-wrapper {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    background: var(--gray);
    padding: 12px 14px;
    text-align: left;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-light);
    white-space: nowrap;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--gray);
    color: var(--text);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafd; }
  .td-actions { display: flex; gap: 6px; }

  /* CHIPS */
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .chip-blue { background: #e8f0ff; color: var(--blue); }
  .chip-cyan { background: #e0f8fc; color: #0d8aa0; }
  .chip-orange { background: #fff3e0; color: #b85a0a; }
  .chip-green { background: #e8f8f0; color: #1a7a45; }
  .chip-red { background: #fde8e8; color: #c0392b; }

  /* CHECKLIST */
  .check-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 2px solid var(--gray2);
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .check-item:hover { border-color: var(--cyan); background: #f8feff; }
  .check-item.checked { border-color: var(--success); background: #f0fbf5; }
  .check-box {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 2px solid var(--gray2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .check-item.checked .check-box { background: var(--success); border-color: var(--success); }
  .check-mark { color: white; font-size: 14px; display: none; }
  .check-item.checked .check-mark { display: block; }
  .check-info { flex: 1; }
  .check-escuela { font-weight: 800; color: var(--blue); font-size: 14px; }
  .check-nro { font-size: 12px; color: var(--text-light); font-weight: 600; }
  .check-date { font-size: 11px; color: var(--success); font-weight: 700; margin-top: 2px; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--gray);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 100px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-light);
    transition: all 0.2s;
    text-align: center;
  }
  .tab.active {
    background: white;
    color: var(--blue);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* ADMIN SECTION */
  .admin-only { display: none; }

  /* SEARCH BAR */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    border: 2px solid var(--gray2);
    border-radius: var(--radius-sm);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--cyan); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: white;
    z-index: 1;
  }
  .modal-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--blue);
    font-size: 18px;
  }
  .modal-close {
    background: var(--gray);
    border: none;
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-body { padding: 24px; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: white;
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 13px;
    animation: slideIn 0.3s ease;
    min-width: 260px;
    max-width: 360px;
    border-left: 4px solid var(--success);
  }
  .toast.error { border-color: var(--danger); }
  .toast.warning { border-color: var(--warning); }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:none;opacity:1} }

  /* SYNC INDICATOR */
  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff3e0;
    color: var(--warning);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .sync-badge.synced { background: #e8f8f0; color: var(--success); }

  /* CONFIG PANEL */
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .config-card {
    background: var(--gray);
    border-radius: 12px;
    padding: 20px;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .config-card:hover { border-color: var(--cyan); }
  .config-card-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 12px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== RESUMEN CHARTS ===== */
  .bar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .bar-label { min-width: 130px; font-weight: 700; color: var(--text); }
  .bar-track {
    flex: 1;
    background: var(--gray);
    border-radius: 20px;
    height: 20px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 0.6s ease;
  }
  .bar-count { min-width: 28px; text-align: right; font-weight: 800; color: var(--blue); }

  /* ===== PRINT / ACREDITACION ===== */
  @media print {
    body * { visibility: hidden !important; }
    #acreditacion-print, #acreditacion-print * { visibility: visible !important; }
    #acreditacion-print {
      position: fixed !important;
      inset: 0 !important;
      z-index: 99999 !important;
      background: white !important;
      padding: 20mm 20mm !important;
    }
  }
  #acreditacion-print { display: none; }

  .acred-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--blue);
  }
  .acred-logo-letters { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 38px; letter-spacing: -2px; }
  .acred-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--blue);
  }
  .acred-subtitle { font-size: 13px; color: var(--text-light); font-weight: 600; }
  .acred-fecha {
